DNADesign\Elemental\Models\ElementContent:
  impressum:
    Title: 'Impressum'
    ShowTitle: 1
    TitleLevel: '1'
    ParentID: =>DNADesign\Elemental\Models\ElementalArea.impressumArea
    HTML: '<h2 class="inline">Inhalte und Redaktion</h2><p class="halveinline">[Location, Title="1", Field="Title"]<br>[Location, Title="1", Field="Address"]<br>[Location, Title="1", Field="PostalCode"] [Location, Title="1", Field="Town"]</p><p class="halveinline">[Location Title="1" Field="TelLink"]</p><p>[Location, Title="1", Field="EMailLink"]</p><h2 class="inline">Beratung, Design &amp; Code</h2><p><a rel="noopener noreferrer" href="https://kraftausdruck.ch/" target="_blank">kraftausdruck.ch</a></p><p>&nbsp;</p>'
  rechtiches:
    Title: 'Datenschutz & Rechtliches'
    ShowTitle: 1
    TitleLevel: '1'
    ParentID: =>DNADesign\Elemental\Models\ElementalArea.datenschutzArea
    HTML: '<h2>Rechtliche Hinweise</h2><h3>Urheberrecht</h3><p>Sämtliche Inhalte dieser Webseite (Texte, Bilder, Grafiken, Videos) sind urheberrechtlich geschützt. Jede Verwendung ausserhalb des privaten Gebrauchs bedarf unserer vorherigen schriftlichen Zustimmung.</p><h3>Haftung</h3><p>Wir pflegen die Inhalte dieser Webseite sorgfältig, übernehmen jedoch keine Gewähr für deren Richtigkeit, Vollständigkeit und Aktualität. Für die Inhalte verlinkter externer Webseiten sind ausschliesslich deren Betreiber verantwortlich.</p><h2>Datenschutzerklärung</h2><p>Diese Datenschutzerklärung informiert Sie darüber, welche Personendaten wir beim Besuch dieser Webseite bearbeiten, zu welchen Zwecken, an wen wir sie bekanntgeben und welche Rechte Sie haben. Massgebend ist das Schweizer Datenschutzgesetz (DSG); soweit die EU-Datenschutz-Grundverordnung (DSGVO) anwendbar ist, gilt sie ergänzend.</p><h3>Verantwortliche Stelle</h3><p class="halveinline">[Location, Title="1", Field="Title"]<br>[Location, Title="1", Field="Address"]<br>[Location, Title="1", Field="PostalCode"] [Location, Title="1", Field="Town"]</p><p class="halveinline">[Location, Title="1", Field="TelLink"]</p><p>[Location, Title="1", Field="EMailLink"]</p><h3>Server-Logfiles</h3><p>Bei jedem Aufruf dieser Webseite werden automatisch technische Daten erfasst:</p><ul class="split-2"><li>IP-Adresse</li><li>Datum und Uhrzeit des Zugriffs</li><li>aufgerufene Seite bzw. Datei</li><li>übertragene Datenmenge und Statuscode</li><li>Browser und Betriebssystem</li><li>Referrer (zuvor besuchte Seite)</li></ul><p>Diese Daten dienen dem sicheren und stabilen Betrieb der Webseite. Sie werden nach kurzer Zeit (in der Regel wenige Wochen) gelöscht, ausser bei konkreten Hinweisen auf Missbrauch.</p><h3>Kontaktformular und E-Mail</h3><p>Wenn Sie uns per Formular oder E-Mail kontaktieren, bearbeiten wir Ihre Angaben zur Beantwortung der Anfrage und für allfällige Anschlussfragen. Auf der Webseite gespeicherte Formulareingaben (inkl. hochgeladener Dateien) werden im Rahmen der regelmässigen Datenbereinigung nach [RetentionPeriod] automatisch gelöscht. Per E-Mail erhaltene Anfragen bewahren wir auf, solange es für die Bearbeitung nötig ist oder gesetzliche Aufbewahrungspflichten bestehen.</p><p>Formulareingaben (z.B. Bewerbungen) können wir durch externe Dienste, etwa KI-gestützte Textanalyse, vorprüfen lassen. Die Entscheidung trifft stets ein Mensch; es findet keine automatisierte Einzelentscheidung im Sinne von Art. 21 DSG statt.</p><h3>Cookies</h3><p>Technisch notwendige Cookies (z.B. für die Sitzung oder Ihre Cookie-Einstellungen) setzen wir ohne Einwilligung. Cookies für Analyse und Statistik setzen wir nur mit Ihrer Einwilligung. [ConsentLink, beforeText = "Ihre Auswahl können Sie jederzeit per ", afterText=" anpassen."] Zudem können Sie Cookies in Ihrem Browser einschränken oder löschen.</p><h3>Eingesetzte Dienste</h3><ul><li><strong>Hosting:</strong> Ein externer Anbieter stellt Server, Datenbank, E-Mail-Versand und Datensicherungen bereit und bearbeitet Daten ausschliesslich in unserem Auftrag (Art. 9 DSG).</li><li><strong>Google reCAPTCHA</strong> (Google): schützt Formulare vor Spam. Wird auf Seiten mit Formularen beim Aufruf geladen und wertet u.a. IP-Adresse, Browserdaten und Nutzungsverhalten aus.</li><li><strong>Google Maps</strong> (Google): zeigt Karten an. Beim Aufruf einer Seite mit Karte wird Ihre IP-Adresse an Google übermittelt.</li><li><strong>YouTube</strong> (Google): bindet Videos im erweiterten Datenschutzmodus (youtube-nocookie.com) ein. Beim Laden eines Videos wird Ihre IP-Adresse an Google übermittelt.</li><li><strong>Instagram</strong> (Meta): zeigt Beiträge an. Texte rufen wir serverseitig ab, Bilder und Videos werden jedoch direkt von Meta geladen, wobei Ihre IP-Adresse an Meta übermittelt wird.</li><li><strong>Google Tag Manager</strong> (Google): lädt die nachfolgenden Analysedienste. Setzt selbst keine Cookies, übermittelt aber Ihre IP-Adresse an Google.</li><li><strong>Google Analytics 4</strong> (Google, nur mit Einwilligung): misst Reichweite und Nutzung, z.B. besuchte Seiten und Verweildauer. IP-Adressen werden nicht gespeichert.</li><li><strong>Microsoft Clarity</strong> (Microsoft, nur mit Einwilligung): zeichnet Mausbewegungen, Klicks und Scrollverhalten auf, um die Webseite zu verbessern.</li></ul><p>Google Analytics und Microsoft Clarity können zusammen ein Profil Ihres Nutzungsverhaltens auf dieser Webseite ergeben (Profiling). Wir nutzen dieses ausschliesslich zur Verbesserung des Angebots. Schriftarten liefern wir selbst aus; dabei fliessen keine Daten an Dritte.</p><p>Anbieter: Google Ireland Limited (<a rel="noopener noreferrer" href="https://policies.google.com/privacy" target="_blank">Datenschutzerklärung</a>), Meta Platforms Ireland Limited (<a rel="noopener noreferrer" href="https://privacycenter.instagram.com/policy" target="_blank">Datenschutzrichtlinie</a>), Microsoft Ireland Operations Limited (<a rel="noopener noreferrer" href="https://privacy.microsoft.com/de-ch/privacystatement" target="_blank">Datenschutzerklärung</a>).</p><h3>Bekanntgabe ins Ausland</h3><p>Die genannten Anbieter sowie die Dienste zur Vorprüfung von Formulareingaben können Personendaten in der EU und in den USA bearbeiten. Die EU verfügt nach Schweizer Recht über einen angemessenen Datenschutz. Für die USA stützen wir uns auf das Swiss-U.S. Data Privacy Framework bzw., wo dieses nicht greift, auf Standardvertragsklauseln.</p><h3>Datensicherheit</h3><p>Wir schützen Personendaten mit angemessenen technischen und organisatorischen Massnahmen (Art. 8 DSG). Die Verbindung zu dieser Webseite ist verschlüsselt (HTTPS).</p><h3>Ihre Rechte</h3><p>Sie haben das Recht auf unentgeltliche Auskunft über Ihre Personendaten (Art. 25 DSG), auf deren Herausgabe oder Übertragung in einem gängigen elektronischen Format (Art. 28 DSG) sowie auf Berichtigung, Löschung und Widerspruch gegen die Bearbeitung (Art. 30 ff. DSG), soweit keine gesetzlichen Pflichten entgegenstehen. Eine Einwilligung können Sie jederzeit für die Zukunft widerrufen. Wenden Sie sich dazu an die oben genannte Stelle. Zudem können Sie sich an den Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) wenden.</p><h3>Änderungen</h3><p>Wir können diese Datenschutzerklärung jederzeit anpassen. Es gilt die jeweils hier veröffentlichte Fassung.</p><p>Stand: Oktober 2026</p><p>&nbsp;</p>'
